services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./biblioteca_yhm:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: biblioteca
      MYSQL_USER: biblio
      MYSQL_PASSWORD: biblio123
    volumes:
      - datos:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
volumes:
  datos:
